# ------------------------------------------------------------------------------
# 分流规则集（精简高效，精准匹配各业务策略组）
# ------------------------------------------------------------------------------
rules:
  # 局域网与内网保留地址直连
  - ip_cidr:
      match: 192.168.0.0/16
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 10.0.0.0/8
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 172.16.0.0/12
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 127.0.0.0/8
      policy: DIRECT
      no_resolve: true
  - ip_cidr:
      match: 100.64.0.0/10
      policy: DIRECT
      no_resolve: true

  # 广告拦截白名单与规则集
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Direct.yaml
      policy: DIRECT
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Reject.yaml
      policy: AdBlock

  # 常用特定规则补充
  - domain_suffix:
      match: raw.githubusercontent.com
      policy: 节点选择
  - domain:
      match: trae-api-sg.mchost.guru
      policy: AI
  - domain:
      match: trae-api-us.mchost.guru
      policy: AI
  - domain:
      match: gemini.google.com
      policy: AI
  - domain:
      match: aistudio.google.com
      policy: AI
  - domain:
      match: copilot.microsoft.com
      policy: AI

  # AI 专属服务
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/AI.yaml
      policy: AI

  # 常用流媒体与社交服务
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/YouTube.yaml
      policy: YouTube
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Netflix.yaml
      policy: Netflix
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Spotify.yaml
      policy: Spotify
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/TikTok.yaml
      policy: TikTok
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Telegram.yaml
      policy: Telegram
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Twitter.yaml
      policy: Twitter
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Facebook.yaml
      policy: 节点选择
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Instagram.yaml
      policy: 节点选择
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Line.yaml
      policy: Line

  # 平台与工具
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Google.yaml
      policy: Google
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Github.yaml
      policy: GitHub
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Microsoft.yaml
      policy: Microsoft
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Apple.yaml
      policy: Apple
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Steam.yaml
      policy: 节点选择
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/PayPal.yaml
      policy: PayPal

  # 国内直连与内网域名
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/Lan.yaml
      policy: DIRECT
  - rule_set:
      match: https://raw.githubusercontent.com/Repcz/Tool/X/Egern/Rules/ChinaDomain.yaml
      policy: DIRECT

  # 中国大陆 IP 直连与最终兜底
  - geoip:
      match: CN
      policy: DIRECT
      no_resolve: true
  - default:
      policy: 漏网之鱼
